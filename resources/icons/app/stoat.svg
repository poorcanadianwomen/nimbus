<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A stoat, drawn as a silhouette. Grey because the client tints its own icons
       with the theme colour at paint time; this one is fixed and has to read on both
       a taskbar and a tray, so it carries its own mid grey rather than a theme value. -->
  <g fill="#8a8c8f">
    <!-- body -->
    <path d="M14 40c0-7 6-12 14-12h10c7 0 12 4 12 10 0 5-4 8-10 8H24c-6 0-10-2-10-6z"/>
    <!-- head -->
    <path d="M46 26c4-1 8 1 9 5 1 4-2 8-6 9-3 1-7 0-9-3-1-3 0-6 2-8 1-1 3-2 4-3z"/>
    <!-- ears -->
    <path d="M47 25a3 3 0 0 1 3-3 3 3 0 0 1 2 4z"/>
    <path d="M53 26a3 3 0 0 1 3-2 3 3 0 0 1 1 4z"/>
    <!-- tail, tapering up and back -->
    <path d="M14 38c-4 0-8-2-10-6 4 1 7 1 10 0z"/>
  </g>
  <circle cx="52" cy="33" r="1.6" fill="#2e2f31"/>
</svg>
